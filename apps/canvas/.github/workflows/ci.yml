name: CI (canvas)

on:
  pull_request:
  push:
    branches: [main]
    paths: ["apps/canvas/**", "packages/m3e/**", "bun.lock", "package.json"]

# Read-only: this also runs on pull requests from forks.
permissions:
  contents: read

concurrency:
  group: ci-canvas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run --cwd apps/canvas typecheck
      - run: bun run --cwd apps/canvas test
      - run: bun run --cwd apps/canvas build
