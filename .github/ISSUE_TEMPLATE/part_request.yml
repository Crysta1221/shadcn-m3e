name: Part request
description: Ask for a Material 3 component that the parts panel does not have yet
labels: ["part request"]
body:
  - type: input
    id: name
    attributes:
      label: Component
      description: The Material name, with a link to its page on m3.material.io if you have it.
      placeholder: Date picker — https://m3.material.io/components/date-pickers
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What you would use it for
      description: The kind of screen where you miss it. This helps decide which variants matter.
    validations:
      required: true
  - type: checkboxes
    id: expressive
    attributes:
      label: Material 3 Expressive
      options:
        - label: This part is new or changed in Material 3 Expressive
