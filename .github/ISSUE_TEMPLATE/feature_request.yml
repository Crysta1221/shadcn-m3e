name: Feature request
description: An idea for the editor, the theme panels, the preview or the prompt
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        For a new Material 3 part, use the **Part request** template instead. For open-ended ideas, Discussions is a better place.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The situation, not the solution. What is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help
      description: How you imagine it working. Sketches and references to other tools are welcome.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Parts and editing
        - Theme (color, shape, type, motion)
        - Preview and navigation
        - Generated prompt
        - Phone editor
        - Languages
        - Other
    validations:
      required: true
